name: RUO Bone Imager

on:
  pull_request:
    paths:
      - 'ruo-bone-imager/**'
      - '.github/workflows/ruo-bone-imager.yml'
  push:
    branches: [main]
    paths:
      - 'ruo-bone-imager/**'
      - '.github/workflows/ruo-bone-imager.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruo-bone-imager-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ruo-bone-imager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ruo-bone-imager/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
